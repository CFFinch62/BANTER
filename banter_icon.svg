<title>BANTER IDE icon</title>
<desc>Two overlapping speech bubbles containing short greeting text, representing a message exchange for the BANTER Smalltalk IDE</desc>
<defs>
<linearGradient id="bubble1b" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#7F77DD"/>
<stop offset="100%" stop-color="#534AB7"/>
</linearGradient>
<linearGradient id="bubble2b" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#5DCAA5"/>
<stop offset="100%" stop-color="#1D9E75"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="300" height="300" rx="52" fill="#1D2126"/>
<path d="M64 84 Q64 60 88 60 L172 60 Q196 60 196 84 L196 136 Q196 160 172 160 L108 160 L76 188 L84 160 Q64 158 64 136 Z" fill="url(#bubble1b)" stroke="#3C3489" stroke-width="1.5"/>
