<path d="M236 144 Q236 124 216 124 L152 124 Q132 124 132 144 L132 190 Q132 210 152 210 L200 210 L228 234 L222 210 Q236 208 236 190 Z" fill="url(#bubble2b)" stroke="#085041" stroke-width="1.5"/>
